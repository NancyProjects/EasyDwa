{% extends 'base.html' %}{% block content %}<h1>New sale</h1><section class="card"><form method="post" id="sale-form">{% csrf_token %}<div id="lines"></div><button type="button" class="secondary" id="add-line">+ Add item</button><div class="grid two"><label>Discount (GHS)<input name="discount" id="discount" type="number" step="0.01" min="0" value="0"></label><label>Payment method<select name="payment_method"><option value="cash">Cash</option><option value="momo">Mobile money</option><option value="card">Card</option><option value="other">Other</option></select></label></div><h2 id="total">Total: GHS 0.00</h2><button {% if not products %}disabled{% endif %}>Complete sale</button></form>{% if not products %}<p>Add a product first.</p>{% endif %}</section><template id="row"><div class="sale-line"><select name="product" required>{% for p in products %}<option value="{{ p.pk }}" data-price="{{ p.selling_price }}">{{ p.name }} — GHS {{ p.selling_price }} ({{ p.stock }} left)</option>{% endfor %}</select><input name="quantity" type="number" value="1" min="1" required aria-label="Quantity"><button class="light remove" type="button">Remove</button></div></template><script>const lines=document.querySelector('#lines'),template=document.querySelector('#row'),total=document.querySelector('#total');function calc(){let sum=0;for(const row of lines.children){sum+=Number(row.querySelector('select').selectedOptions[0]?.dataset.price||0)*Number(row.querySelector('input').value||0)}total.textContent='Total: GHS '+Math.max(0,sum-Number(document.querySelector('#discount').value||0)).toFixed(2)}document.querySelector('#add-line').onclick=()=>{lines.append(template.content.cloneNode(true));calc()};lines.addEventListener('input',calc);lines.addEventListener('change',calc);lines.addEventListener('click',e=>{if(e.target.classList.contains('remove')){e.target.closest('.sale-line').remove();calc()}});document.querySelector('#discount').addEventListener('input',calc);{% if products %}document.querySelector('#add-line').click();{% endif %}</script>{% endblock %}
