{% extends 'base.html' %}{% block content %}<div class="heading"><h1>Sales</h1><a class="button" href="{% url 'new_sale' %}">New sale</a></div><div class="table-wrap"><table><tr><th>Receipt</th><th>Date</th><th>Payment</th><th>Total</th><th>Staff</th></tr>{% for s in rows %}<tr><td><a href="{% url 'receipt' s.pk %}">{{ s.receipt_number }}</a></td><td>{{ s.created_at|date:'d M Y H:i' }}</td><td>{{ s.get_payment_method_display }}</td><td>GHS {{ s.total }}</td><td>{{ s.user|default:'—' }}</td></tr>{% empty %}<tr><td colspan="5">No sales yet.</td></tr>{% endfor %}</table></div>{% endblock %}
