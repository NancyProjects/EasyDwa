{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Bookshop{% endblock %}</title><link rel="stylesheet" href="{% static 'style.css' %}"></head><body><header><div class="brand">📚 EasyDwa</div>{% if user.is_authenticated %}<nav><a href="{% url 'dashboard' %}">Dashboard</a><a href="{% url 'products' %}">Products</a><a href="{% url 'stock' %}">Stock</a><a href="{% url 'new_sale' %}">New sale</a><a href="{% url 'sales' %}">Sales</a><a href="{% url 'reports' %}">Reports</a></nav><form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="light">Sign out</button></form>{% endif %}</header><main>{% for message in messages %}<div class="notice {% if message.tags == 'error' %}error{% endif %}">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
